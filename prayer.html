<!-- Sets .js before first paint so the scroll-reveal rules in style.css apply.
     Without JS the no-JS safety net at the end of style.css keeps everything visible. -->
<script>document.documentElement.className += " js";</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero" id="main-content" tabindex="-1">
  <div class="container">
    <span class="eyebrow">Selah: pause, reflect, praise.</span>
    <h1>You don't have to carry it alone.</h1>
    <p>Whatever you're walking through, our team would be honored to pray with you. This is read only by our pastoral team, and held in confidence.</p>
  </div>
</section>

<section class="section section--paper">
  <div class="container">
    <div class="reveal" style="max-width:520px;margin:0 auto 3rem;border-radius:var(--radius);overflow:hidden;">
      <img src="assets/photos/prayer-photo.jpg" alt="" style="width:100%;aspect-ratio:1/1;object-fit:cover;" loading="lazy">
    </div>
    <form class="form-card" data-inline-confirm data-form-type="prayer" novalidate>
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">
      <div class="form-field">
        <label for="p-name">Name<span class="required-mark" aria-hidden="true">*</span></label>
        <input type="text" id="p-name" name="name" required>
      </div>
      <div class="form-field">
        <label for="p-email">Email <span style="text-transform:none; opacity:.7;">(optional, if you'd like a response)</span></label>
        <input type="email" id="p-email" name="email">
      </div>
      <div class="form-field">
        <label for="p-request">Your prayer request<span class="required-mark" aria-hidden="true">*</span></label>
        <textarea id="p-request" name="request" required placeholder="Share as much or as little as you're comfortable with."></textarea>
      </div>
      <div class="checkbox-field">
        <input type="checkbox" id="p-confidential" name="confidential">
        <label for="p-confidential">Please keep this request confidential, shared only with the pastoral team.</label>
      </div>
      <button type="submit" class="btn btn-gold">Submit Prayer Request</button>
      <p class="form-note">This goes directly to our pastoral team — we'll be praying for you.</p>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/vendor/gsap/gsap.min.js" defer></script>
<script src="assets/vendor/gsap/ScrollTrigger.min.js" defer></script>
<script src="header.js" defer></script>
<script src="footer.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
