<!-- Sets .js before first paint so the scroll-reveal rules in style.css apply.
     Without JS the no-JS safety net at the end of style.css keeps everything visible. -->
<script>document.documentElement.className += " js";</script>
<link rel="stylesheet" href="style.css">

<body>

<div id="site-header"></div>

<section class="page-hero" id="main-content" tabindex="-1">
  <div class="container">
    <span class="eyebrow">Get Involved</span>
    <h1>What&rsquo;s happening at Selah.</h1>
    <p>These are the rhythms we keep as a church family &mdash; weekly, monthly, and always open.</p>
  </div>
</section>

<section class="section section--paper">
  <div class="container">
    <!-- Luke's ask, 2026-08-20: point people at Church Center first, since
         that calendar is the source of truth and this page is a mirror of it. -->
    <p class="calendar-callout">
      For more exact information, check our calendar on Church Center
      <a href="https://selahchurch.churchcenter.com/calendar?view=month" target="_blank" rel="noopener">here</a>!
    </p>

    <h2 class="sr-only">Upcoming Events</h2>

    <!-- Events render from content/events.json, which the staff dashboard at
         /admin writes. Nothing about an event is hard-coded here any more:
         static cards stopped being safe the moment Luke could edit events
         himself, because a card that disagrees with the dashboard is worse
         than no card. Without JavaScript the noscript block sends people to
         Church Center, which this page already calls the source of truth. -->
    <div class="event-list" id="eventList"></div>

    <noscript>
      <p class="calendar-callout">
        Our events list needs JavaScript to work out the next date for each
        gathering. You can see everything on our
        <a href="https://selahchurch.churchcenter.com/calendar?view=month" target="_blank" rel="noopener">Church Center calendar</a>.
      </p>
    </noscript>
  </div>
</section>

<div id="site-footer"></div>
